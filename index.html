<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Javascript</title>
    <script
      src="https://kit.fontawesome.com/aaf7cadbee.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="src/output.css" />
  </head>
  <body class="overflow-hidden">
    <header class="w-full h-20 p-4 flex items-center">
      <span
        ><i class="fa-solid fa-cart-shopping text-2xl color cursor-pointer"></i
      ></span>
      <span id="total" class="text-amber-600">0.000</span
      ><sup class="text-amber-600">đ</sup>
    </header>

    <section>
      <div class="container max-w-300 mx-auto">
        <div class="product-items flex flex-wrap justify-between bg-[#ddd] p-3">
          <div
            class="product-item w-full bg-white p-3 text-center md:w-[30%] lg:w-[19%]"
          >
            <img src="img/1.webp" alt="" class="w-full mb-5" />
            <div id="product-item-text" class="flex justify-between">
              <p><span>320.000</span><sup>đ</sup></p>
              <h1 class="font-bold text-xl">Iphone 6</h1>
            </div>
            <button
              class="mt-3 h-7.5 px-3 cursor-pointer border rounded-lg hover:bg-amber-600 transition-all duration-300 ease"
            >
              Add to cart
            </button>
          </div>

          <div
            class="product-item w-full bg-white p-3 text-center md:w-[30%] lg:w-[19%]"
          >
            <img src="img/2.webp" alt="" class="w-full mb-5" />
            <div id="product-item-text" class="flex justify-between">
              <p><span>710.000</span><sup>đ</sup></p>
              <h1 class="font-bold text-xl">Iphone 7</h1>
            </div>
            <button
              class="mt-3 h-7.5 px-3 cursor-pointer border rounded-lg hover:bg-amber-600 transition-all duration-300 ease"
            >
              Add to cart
            </button>
          </div>

          <div
            class="product-item w-full bg-white p-3 text-center md:w-[30%] lg:w-[19%]"
          >
            <img src="img/4.webp" alt="" class="w-full mb-5" />
            <div id="product-item-text" class="flex justify-between">
              <p><span>370.000</span><sup>đ</sup></p>
              <h1 class="font-bold text-xl">Iphone 8</h1>
            </div>
            <button
              class="mt-3 h-7.5 px-3 cursor-pointer border rounded-lg hover:bg-amber-600 transition-all duration-300 ease"
            >
              Add to cart
            </button>
          </div>

          <div
            class="product-item w-full bg-white p-3 text-center md:w-[30%] lg:w-[19%]"
          >
            <img src="img/5.webp" alt="" class="w-full mb-5" />
            <div id="product-item-text" class="flex justify-between">
              <p><span>120.000</span><sup>đ</sup></p>
              <h1 class="font-bold text-xl">Iphone 9</h1>
            </div>
            <button
              class="mt-3 h-7.5 px-3 cursor-pointer border rounded-lg hover:bg-amber-600 transition-all duration-300 ease"
            >
              Add to cart
            </button>
          </div>

          <div
            class="product-item w-full bg-white p-3 text-center md:w-[30%] lg:w-[19%]"
          >
            <img src="img/6.webp" alt="" class="w-full mb-5" />
            <div id="product-item-text" class="flex justify-between">
              <p><span>420.000</span><sup>đ</sup></p>
              <h1 class="font-bold text-xl">Iphone 10</h1>
            </div>
            <button
              class="mt-3 h-7.5 px-3 cursor-pointer border rounded-lg hover:bg-amber-600 transition-all duration-300 ease"
            >
              Add to cart
            </button>
          </div>
        </div>
      </div>
    </section>

    <section
      id="cart"
      class="w-[90%] h-full bg-[#fdd8d8] p-8 absolute top-0 right-0 transform translate-x-full transition-all duration-300 ease-out md:w-[50%] xl:w-[30%]"
    >
      <span
        ><i class="fa-solid fa-xmark font-bold text-3xl cursor-pointer"></i
      ></span>

      <h1 class="font-bold text-3xl text-center">Cart</h1>
      <form class="" action="">
        <table class="w-full">
          <thead class="h-20">
            <tr class="">
              <th class="text-left">Sản phâm</th>
              <th>Giá</th>
              <th>Số lượng</th>
              <th>Chọn</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div id="total-price" class="text-right my-4">
          <p class="font-bold">Tổng tiền: <span>0</span><sup>đ</sup></p>
        </div>
      </form>
    </section>

    <script src="script.js"></script>
  </body>
</html>
